# Optional. Monet needs only Node and pnpm; every task below is a plain pnpm script,
# so `pnpm <task>` works identically without mise installed.

[tools]
# pnpm 11 requires Node >=22.13; this also satisfies Vite 7.
node = "22.23.2"
pnpm = "11.18.0"

[tasks.dev]
description = "Run the Monet workspace UI and its loopback file service"
run = "pnpm dev"

[tasks.mcp]
description = "Run Monet's read-only MCP server over stdio"
run = "pnpm mcp"

[tasks.validate]
description = "Check the active workspace for integrity problems"
run = "pnpm validate"

[tasks.check]
description = "Build, lint, test, and validate"
run = "pnpm check"
